.fc-logo{width:76px;height:76px;border-radius:20px;background:#fff center/contain no-repeat;display:grid;place-items:center;font-weight:800;font-size:26px;color:var(--acT,var(--ac));box-shadow:0 14px 34px -12px rgba(0,0,0,.5);border:4px solid #fff}
.fc-logo.fh-logo-circle{border-radius:50%}.fc-logo.fh-logo-square{border-radius:8px}.fc-logo.fh-logo-none{display:none}
.fc-kick{font-weight:700;font-size:15px;opacity:.88}
.fc-h{font-family:var(--font-display);font-weight:700;font-size:clamp(32px,6.4vw,56px);line-height:1.08;letter-spacing:-.02em;margin:0;text-wrap:balance}
.fc-t{font-size:clamp(15px,2.2vw,18px);line-height:1.55;opacity:.9;margin:0;max-width:56ch;white-space:pre-wrap}
.fc-chips{display:flex;gap:8px;flex-wrap:wrap}.fc-c .fc-chips{justify-content:center}
.fc-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:30px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px)}
.fc-btn{margin-top:10px;display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 28px;border-radius:15px;border:0;background:#fff;color:#0b1a20;font-weight:800;font-size:16px;box-shadow:0 16px 34px -14px rgba(0,0,0,.55);cursor:pointer;transition:transform .15s}
.fc-btn:hover{transform:translateY(-2px)}.fc-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.fc-note{font-size:13px;opacity:.75;margin:4px 0 0}
:root{--ac:#2E6F73;--ac-ink:#FFFFFF}#prog{background:linear-gradient(90deg,var(--ac),#C6601F)}::selection{background:rgba(198,96,31,.35)}button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid #C6601F;outline-offset:2px}.btn:not(.pri):hover{border-color:#C6601F}</style></head>
